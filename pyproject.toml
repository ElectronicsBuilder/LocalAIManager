[project]
name = "local-ai-manager"
version = "0.1.0"
description = "Local AI Manager - VS Code-style CustomTkinter GUI for managing WSL2, Ollama, GPU monitoring, Gaming Mode, and Start with Windows."
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=6.0,<7",  # tested with 6.0.0; see docs/DECISIONS.md D-009
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
